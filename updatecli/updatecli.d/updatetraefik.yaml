---
name: "Update traefik version" 

sources:
 traefik:
   name: Get traefik version
   kind: githubrelease
   spec:
     owner: traefik
     repository: traefik
     token: '{{ requiredEnv .github.token }}'
     typefilter:
       release: true
       draft: false
       prerelease: false
     versionfilter:
       kind: semver
 
 traefikSrcSha256:
   name: Get traefik source tarball sha256
   kind: shell
   spec:
     command: 'curl -fsSL "https://github.com/traefik/traefik/releases/download/{{ source "traefik" }}/traefik-{{ source "traefik" }}.src.tar.gz" | sha256sum | cut -d'' '' -f1'

targets:
  traefikSources:
    name: "Add latest Traefik source checksum"
    kind: shell
    scmid: default
    sourceid: traefikSrcSha256
    spec:
      command: 'sh updatecli/scripts/append-traefik-source.sh {{ source "traefik" }}'

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ .github.username }}'
      user: '{{ .github.username }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'
      
actions:
    default:
        title: 'Bump traefik version to {{ source "traefik" }}'
        kind: github/pullrequest
        spec:
          merge:
            strategy: auto
          labels:
            - updatecli
        scmid: default
